<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E-postanı doğrula</title>
</head>
<body style="margin:0;padding:0;background:#f3f3ef;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0">Hesabını açmak için e-postanı doğrula.</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#f3f3ef" style="background:#f3f3ef;margin:0;padding:0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%">
          <tr>
            <td bgcolor="#0c0c0c" style="background:#0c0c0c;padding:20px 24px;border-radius:16px 16px 0 0">
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="background:#c8f04b;color:#0c0c0c;font-family:Arial,sans-serif;font-size:11px;font-weight:700;width:32px;height:32px;text-align:center;border-radius:8px">iL</td>
                  <td style="padding-left:10px;font-family:Arial,sans-serif;font-size:22px;font-weight:700;color:#f3f3ef;letter-spacing:-0.03em">iLazım</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td bgcolor="#c8f04b" style="background:#c8f04b;height:4px;font-size:0;line-height:0">&nbsp;</td>
          </tr>
          <tr>
            <td bgcolor="#ffffff" style="background:#ffffff;padding:28px 24px 32px;font-family:Arial,Helvetica,sans-serif;color:#0c0c0c">
              <p style="margin:0 0 8px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#5b5b55">Hoş geldin</p>
              <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2;letter-spacing:-0.03em">E-postanı doğrula</h1>
              <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#0c0c0c">iLazım’a kayıt oldun. Hesabın açılsın diye bu adresi doğrula.</p><p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#0c0c0c">Bağlantı bir süre sonra geçersiz olur.</p>
              
              <p style="margin:28px 0 0">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0c0c0c;color:#c8f04b;text-decoration:none;padding:14px 22px;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:0.01em">
          E-postamı doğrula
        </a>
      </p>
              <p style="margin:22px 0 0;font-size:12px;line-height:1.6;color:#5b5b55">Kod: {{ .Token }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 8px 0;font-family:Arial,sans-serif;font-size:12px;line-height:1.6;color:#5b5b55;text-align:center">
              Ne lazımsa, teklif gelsin.<br />
              <a href="https://ilazim.online" style="color:#0c0c0c;text-decoration:none">ilazim.online</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
